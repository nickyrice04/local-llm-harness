<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop OS</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --taskbar-h: 48px;
    --accent: #0078d4;
    --accent-hover: #1a86d9;
    --surface: #1e1e1e;
    --surface-light: #2d2d2d;
    --surface-lighter: #383838;
    --text: #f0f0f0;
    --text-dim: #aaaaaa;
    --border: #444444;
    --window-radius: 8px;
    --titlebar-h: 36px;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    font-size: 14px;
    color: var(--text);
    user-select: none;
  }

  /* ── Wallpaper ── */
  #desktop {
    position: fixed; inset: 0;
    bottom: var(--taskbar-h);
    background:
      radial-gradient(ellipse at 20% 80%, rgba(0,120,212,.25) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(120,0,200,.2) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(0,200,150,.12) 0%, transparent 60%),
      linear-gradient(135deg, #0f0c29 0%, #1a1a3e 40%, #24243e 70%, #0f0c29 100%);
  }

  /* ── Taskbar ── */
  #taskbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--taskbar-h);
    background: rgba(25,25,35,.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,.08);
    display: flex;
    align-items: center;
    padding: 0 8px;
    z-index: 10000;
  }

  #start-button {
    width: 36px; height: 36px;
    border: none; border-radius: 6px;
    background: transparent;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
    flex-shrink: 0;
  }
  #start-button:hover, #start-button.active {
    background: rgba(255,255,255,.1);
  }
  #start-button svg { width: 18px; height: 18px; fill: currentColor; }

  #taskbar-clock {
    margin-left: auto;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: right;
    line-height: 1.4;
  }

  /* ── Start Menu ── */
  #start-menu {
    position: fixed;
    bottom: calc(var(--taskbar-h) + 8px);
    left: 8px;
    width: 260px;
    background: rgba(32,32,44,.96);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 8px 0;
    display: none;
    z-index: 10001;
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
  }
  #start-menu.open { display: block; }

  .start-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background .12s;
  }
  .start-item:hover { background: rgba(255,255,255,.08); }
  .start-item .app-icon {
    width: 32px; height: 32px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .start-item .app-label { font-size: 13px; }

  /* ── Window ── */
  .window {
    position: absolute;
    min-width: 280px; min-height: 180px;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: var(--window-radius);
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column;
    overflow: hidden;
    z-index: 100;
  }
  .window.minimized { display: none; }

  .titlebar {
    height: var(--titlebar-h);
    display: flex; align-items: center;
    padding: 0 10px;
    background: var(--surface-light);
    border-bottom: 1px solid rgba(255,255,255,.06);
    cursor: grab;
    flex-shrink: 0;
  }
  .titlebar:active { cursor: grabbing; }
  .titlebar .app-icon { margin-right: 8px; font-size: 14px; }
  .titlebar .title { flex: 1; font-size: 12px; font-weight: 600; color: var(--text-dim); }

  .titlebar-buttons { display: flex; gap: 6px; }
  .titlebar-buttons button {
    width: 28px; height: 22px;
    border: none; border-radius: 4px;
    background: transparent;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s;
  }
  .titlebar-buttons .btn-close:hover { background: #e81123; color: #fff; }
  .titlebar-buttons .btn-minimize:hover { background: var(--surface-lighter); }

  .window-body {
    flex: 1; overflow: auto;
    padding: 0;
  }

  /* ── Notepad ── */
  #notepad-text {
    width: 100%; height: 100%;
    background: var(--surface);
    color: var(--text);
    border: none; outline: none;
    padding: 12px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 14px;
    resize: none;
    line-height: 1.6;
  }

  /* ── Calculator ── */
  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
    padding: 8px;
    height: 100%;
  }
  #calc-display {
    grid-column: 1 / -1;
    background: var(--surface-lighter);
    color: var(--text);
    font-size: 28px;
    font-weight: 300;
    text-align: right;
    padding: 12px 16px;
    border-radius: 6px;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    overflow: hidden;
    word-break: break-all;
  }
  .calc-grid button[data-key] {
    border: none;
    border-radius: 5px;
    background: var(--surface-light);
    color: var(--text);
    font-size: 16px;
    padding: 14px 0;
    cursor: pointer;
    transition: background .1s;
  }
  .calc-grid button[data-key]:hover { background: var(--surface-lighter); }
  .calc-grid button[data-key].operator { background: var(--surface-lighter); color: var(--accent); }
  .calc-grid button[data-key].equals {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .calc-grid button[data-key].equals:hover { background: var(--accent-hover); }
  .calc-grid button[data-key].clear { color: #e81123; }

  /* ── About ── */
  .about-body {
    padding: 24px;
    text-align: center;
    line-height: 1.7;
  }
  .about-body h2 { font-size: 18px; margin-bottom: 8px; font-weight: 600; }
  .about-body p { color: var(--text-dim); font-size: 13px; }
  .about-body .logo { font-size: 48px; margin-bottom: 12px; }
</style>
</head>
<body>

<div id="desktop"></div>

<!-- Taskbar -->
<div id="taskbar">
  <button id="start-button" title="Start">
    <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4V4zm8 0h8v7h-8V4zM4 12h7v8H4v-8zm8 0h8v8h-8v-8z"/></svg>
  </button>
  <div id="taskbar-clock"></div>
</div>

<!-- Start Menu -->
<div id="start-menu"></div>

<script>
(() => {
  "use strict";

  /* ── App definitions ── */
  const apps = [
    { id: "notepad",      label: "Notepad",      icon: "📝", color: "#4a90d9" },
    { id: "calculator",   label: "Calculator",   icon: "🔢", color: "#d98a4a" },
    { id: "about",        label: "About",        icon: "ℹ️",  color: "#4ad98a" },
  ];

  const menuEl = document.getElementById("start-menu");
  apps.forEach(a => {
    const item = document.createElement("div");
    item.className = "start-item";
    item.setAttribute("data-app", a.id);
    item.innerHTML = `<span class="app-icon" style="background:${a.color}">${a.icon}</span><span class="app-label">${a.label}</span>`;
    item.addEventListener("click", () => { openApp(a.id); closeMenu(); });
    menuEl.appendChild(item);
  });

  /* ── Start button toggle ── */
  const startBtn = document.getElementById("start-button");
  startBtn.addEventListener("click", e => {
    e.stopPropagation();
    const opening = !menuEl.classList.contains("open");
    if (opening) { openMenu(); } else { closeMenu(); }
  });
  document.addEventListener("click", e => {
    if (!menuEl.contains(e.target) && e.target !== startBtn && !startBtn.contains(e.target)) closeMenu();
  });

  function openMenu()  { menuEl.classList.add("open");  startBtn.classList.add("active"); }
  function closeMenu() { menuEl.classList.remove("open"); startBtn.classList.remove("active"); }

  /* ── Clock ── */
  const clockEl = document.getElementById("taskbar-clock");
  function tick() {
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    clockEl.append("\n");
    clockEl.append(now.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" }));
  }
  tick(); setInterval(tick, 10000);

  /* ── Window management ── */
  let zCounter = 100;
  const desktop = document.getElementById("desktop");

  const windows = {};

  function bringToFront(win) {
    win.style.zIndex = ++zCounter;
  }

  /* ── Notepad ── */
  function buildNotepad() {
    const body = document.createElement("div");
    body.id = "notepad-text";
    body.contentEditable = "true";
    body.spellcheck = false;
    return body;
  }

  /* ── Calculator ── */
  function buildCalculator() {
    const grid = document.createElement("div");
    grid.className = "calc-grid";

    const keys = [
      "C","%","/","*",
      "7","8","9","-",
      "4","5","6","+",
      "1","2","3",".",
      "0","="
    ];

    const display = document.createElement("div");
    display.id = "calc-display";
    display.textContent = "0";
    grid.appendChild(display);

    let current = "";
    let previous = "";
    let operator = null;
    let resetNext = false;

    keys.forEach(k => {
      const btn = document.createElement("button");
      btn.textContent = k;
      btn.setAttribute("data-key", k);
      btn.addEventListener("click", () => {
        handleCalcKey(k);
      });
      grid.appendChild(btn);
    });

    function handleCalcKey(k) {
      if ("0123456789".includes(k)) {
        if (resetNext) { current = ""; resetNext = false; }
        current += k;
        display.textContent = current;
      } else if (k === ".") {
        if (resetNext) { current = "0"; resetNext = false; }
        if (!current.includes(".")) current += ".";
        display.textContent = current;
      } else if (["+", "-", "*", "/"].includes(k)) {
        if (current === "" && previous === "") return;
        if (previous !== "" && current !== "") {
          compute();
        }
        previous = current || previous;
        operator = k;
        resetNext = true;
      } else if (k === "=") {
        if (previous !== "" && current !== "") {
          compute();
        }
      } else if (k === "C") {
        current = ""; previous = ""; operator = null; resetNext = false;
        display.textContent = "0";
      } else if (k === "%") {
        if (current !== "") {
          current = String(parseFloat(current) / 100);
          display.textContent = current;
        }
      }
    }

    function compute() {
      const a = parseFloat(previous);
      const b = parseFloat(current);
      let result;
      switch (operator) {
        case "+": result = a + b; break;
        case "-": result = a - b; break;
        case "*": result = a * b; break;
        case "/": result = b !== 0 ? a / b : "Error"; break;
      }
      current = String(result);
      previous = "";
      operator = null;
      resetNext = true;
      display.textContent = current;
    }

    return grid;
  }

  /* ── About ── */
  function buildAbout() {
    const div = document.createElement("div");
    div.className = "about-body";
    div.innerHTML = `
      <div class="logo">🖥️</div>
      <h2>About Desktop OS</h2>
      <p>A lightweight desktop environment built with vanilla HTML, CSS &amp; JavaScript.</p>
      <p style="margin-top:8px">No external resources. No frameworks. Pure web.</p>
    `;
    return div;
  }

  /* ── Open app ── */
  function openApp(appId) {
    /* If window already exists, restore it */
    if (windows[appId]) {
      const w = windows[appId];
      w.classList.remove("minimized");
      bringToFront(w);
      return;
    }

    const app = apps.find(a => a.id === appId);
    const win = document.createElement("div");
    win.className = "window";
    win.setAttribute("data-app", appId);

    const w = 420, h = 340;
    win.style.width = w + "px";
    win.style.height = h + "px";
    win.style.left = (60 + Math.random() * 120) + "px";
    win.style.top  = (40 + Math.random() * 80)  + "px";
    win.style.zIndex = ++zCounter;

    /* Title bar */
    const titlebar = document.createElement("div");
    titlebar.className = "titlebar";

    const iconSpan = document.createElement("span");
    iconSpan.className = "app-icon";
    iconSpan.textContent = app.icon;

    const titleSpan = document.createElement("span");
    titleSpan.className = "title";
    titleSpan.textContent = app.label;

    const btnGroup = document.createElement("div");
    btnGroup.className = "titlebar-buttons";

    const btnMin = document.createElement("button");
    btnMin.className = "btn-minimize";
    btnMin.title = "Minimize";
    btnMin.textContent = "─";
    btnMin.addEventListener("click", () => win.classList.add("minimized"));

    const btnClose = document.createElement("button");
    btnClose.className = "btn-close";
    btnClose.title = "Close";
    btnClose.textContent = "✕";
    btnClose.addEventListener("click", () => {
      win.remove();
      delete windows[appId];
    });

    btnGroup.appendChild(btnMin);
    btnGroup.appendChild(btnClose);

    titlebar.appendChild(iconSpan);
    titlebar.appendChild(titleSpan);
    titlebar.appendChild(btnGroup);

    /* Body */
    const body = document.createElement("div");
    body.className = "window-body";

    if (appId === "notepad")      body.appendChild(buildNotepad());
    else if (appId === "calculator") body.appendChild(buildCalculator());
    else if (appId === "about")     body.appendChild(buildAbout());

    win.appendChild(titlebar);
    win.appendChild(body);
    desktop.appendChild(win);

    windows[appId] = win;

    /* ── Drag (on titlebar) ── */
    makeDraggable(win, titlebar);

    /* Bring to front on click */
    win.addEventListener("mousedown", () => bringToFront(win));

    /* ── Resize handle ── */
    const handle = document.createElement("div");
    handle.style.cssText = "position:absolute;bottom:0;right:0;width:16px;height:16px;cursor:nwse-resize;z-index:1;";
    win.appendChild(handle);
    makeResizable(win, handle);
  }

  /* ── Draggable ── */
  function makeDraggable(win, handle) {
    let startX, startY, origX, origY;

    handle.addEventListener("mousedown", e => {
      if (e.target.closest(".titlebar-buttons")) return;
      startX = e.clientX; startY = e.clientY;
      origX = win.offsetLeft; origY = win.offsetTop;
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
      e.preventDefault();
    });

    function onMove(e) {
      win.style.left = (origX + e.clientX - startX) + "px";
      win.style.top  = (origY + e.clientY - startY) + "px";
    }
    function onUp() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    }
  }

  /* ── Resizable ── */
  function makeResizable(win, handle) {
    let startX, startY, startW, startH;
    handle.addEventListener("mousedown", e => {
      startX = e.clientX; startY = e.clientY;
      startW = win.offsetWidth; startH = win.offsetHeight;
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
      e.preventDefault(); e.stopPropagation();
    });
    function onMove(e) {
      win.style.width  = Math.max(280, startW + e.clientX - startX) + "px";
      win.style.height = Math.max(180, startH + e.clientY - startY) + "px";
    }
    function onUp() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    }
  }

})();
</script>
</body>
</html>
