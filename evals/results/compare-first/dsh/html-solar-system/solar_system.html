<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System Animation</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 12px;
    color: #aaccff;
    text-shadow: 0 0 12px rgba(100, 160, 255, 0.5);
  }

  #canvas {
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(60, 100, 200, 0.15);
  }

  #controls {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-top: 14px;
    padding: 10px 24px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 40px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(4px);
  }

  #controls label {
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    color: #99b;
    user-select: none;
  }

  #speedSlider {
    -webkit-appearance: none;
    appearance: none;
    width: 140px;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, #224, #44a);
    outline: none;
    cursor: pointer;
  }

  #speedSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #8af, #338);
    box-shadow: 0 0 6px rgba(100, 160, 255, 0.6);
    cursor: pointer;
  }

  #speedSlider::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #8af, #338);
    box-shadow: 0 0 6px rgba(100, 160, 255, 0.6);
    border: none;
    cursor: pointer;
  }

  #speedValue {
    min-width: 36px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: #8af;
  }

  #playPauseBtn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid rgba(100, 160, 255, 0.4);
    background: rgba(40, 60, 120, 0.3);
    color: #8af;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, border-color 0.2s;
  }

  #playPauseBtn:hover {
    background: rgba(60, 90, 180, 0.5);
    border-color: rgba(100, 180, 255, 0.7);
  }

  #info {
    margin-top: 6px;
    font-size: 0.7rem;
    color: #556;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<h1>Solar System</h1>
<canvas id="canvas"></canvas>
<div id="controls">
  <label for="speedSlider">Speed</label>
  <input type="range" id="speedSlider" min="0.1" max="5" step="0.1" value="1">
  <span id="speedValue">1.0×</span>
  <button id="playPauseBtn" title="Pause / Play">&#9654;</button>
</div>
<div id="info">Drag to pan &bull; Scroll to zoom</div>

<script>
(() => {
  // ── Canvas setup ──────────────────────────────────────────────
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const SIZE = Math.min(window.innerWidth - 20, window.innerHeight - 140, 800);
  canvas.width = SIZE;
  canvas.height = SIZE;

  const CX = SIZE / 2;           // center x
  const CY = SIZE / 2;           // center y
  const BASE_ORBIT_RADIUS = SIZE * 0.42;  // max orbit radius

  // ── Starfield ─────────────────────────────────────────────────
  const stars = Array.from({ length: 500 }, () => ({
    x: Math.random() * SIZE,
    y: Math.random() * SIZE,
    r: Math.random() * 1.4 + 0.2,
    brightness: Math.random() * 0.6 + 0.4,
    twinkleSpeed: Math.random() * 0.02 + 0.005
  }));

  // ── Planet data ───────────────────────────────────────────────
  // Distances are fractions of BASE_ORBIT_RADIUS (outermost orbit)
  // Sizes are in pixels, speeds in radians per frame at 1×
  const PLANETS = [
    { name: 'Mercury', orbit: 0.15, radius: 4,  speed: 4.15,  color: '#b0a090', glowColor: 'rgba(180,170,160,0.25)' },
    { name: 'Venus',   orbit: 0.23, radius: 7,  speed: 1.62,  color: '#e8c87a', glowColor: 'rgba(232,200,122,0.25)' },
    { name: 'Earth',   orbit: 0.32, radius: 7,  speed: 1.0,   color: '#4499ee', glowColor: 'rgba(68,153,238,0.3)' },
    { name: 'Mars',    orbit: 0.41, radius: 5,  speed: 0.53,  color: '#dd6644', glowColor: 'rgba(221,102,68,0.25)' },
    { name: 'Jupiter', orbit: 0.55, radius: 15, speed: 0.084, color: '#d4a56a', glowColor: 'rgba(212,165,106,0.3)' },
    { name: 'Saturn',  orbit: 0.68, radius: 13, speed: 0.034, color: '#e8d088', glowColor: 'rgba(232,208,136,0.3)', ring: true },
    { name: 'Uranus',  orbit: 0.80, radius: 10, speed: 0.012, color: '#7ecfcf', glowColor: 'rgba(126,207,207,0.25)' },
    { name: 'Neptune', orbit: 0.92, radius: 9,  speed: 0.006, color: '#4466dd', glowColor: 'rgba(68,102,221,0.3)' },
  ];

  // ── State ─────────────────────────────────────────────────────
  let paused = false;
  let speedMul = 1;
  let angle = 0;          // master angle accumulator
  let panX = 0, panY = 0; // pan offsets
  let zoom = 1;

  // ── DOM refs ──────────────────────────────────────────────────
  const slider = document.getElementById('speedSlider');
  const speedVal = document.getElementById('speedValue');
  const ppBtn = document.getElementById('playPauseBtn');

  slider.addEventListener('input', () => {
    speedMul = parseFloat(slider.value);
    speedVal.textContent = speedMul.toFixed(1) + '×';
  });

  ppBtn.addEventListener('click', () => {
    paused = !paused;
    ppBtn.innerHTML = paused ? '&#9654;' : '&#10074;&#10074;';
  });

  // ── Pan & Zoom via mouse ──────────────────────────────────────
  let dragging = false, dragStartX, dragStartY, panStartX, panStartY;

  canvas.addEventListener('mousedown', e => {
    dragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    panStartX = panX;
    panStartY = panY;
  });

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    panX = panStartX + (e.clientX - dragStartX);
    panY = panStartY + (e.clientY - dragStartY);
  });

  window.addEventListener('mouseup', () => { dragging = false; });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    zoom = Math.max(0.3, Math.min(3, zoom - e.deltaY * 0.001));
  }, { passive: false });

  // ── Helpers ───────────────────────────────────────────────────
  function drawStars(t) {
    for (const s of stars) {
      const flicker = 0.5 + 0.5 * Math.sin(t * s.twinkleSpeed);
      const alpha = s.brightness * (0.6 + 0.4 * flicker);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220,230,255,${alpha.toFixed(3)})`;
      ctx.fill();
    }
  }

  function drawSun() {
    // Outer glow layers
    const glows = [
      { r: 50, a: 0.02 }, { r: 38, a: 0.04 }, { r: 28, a: 0.06 }
    ];
    for (const g of glows) {
      ctx.beginPath();
      ctx.arc(CX, CY, g.r * zoom, 0, Math.PI * 2);
      const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, g.r * zoom);
      grad.addColorStop(0, `rgba(255,200,50,${g.a})`);
      grad.addColorStop(1, 'rgba(255,150,0,0)');
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // Sun body
    const r = 20 * zoom;
    const grad = ctx.createRadialGradient(CX - r * 0.2, CY - r * 0.2, r * 0.1, CX, CY, r);
    grad.addColorStop(0, '#fff8e0');
    grad.addColorStop(0.3, '#ffe060');
    grad.addColorStop(0.7, '#ffaa20');
    grad.addColorStop(1, '#ee6600');
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Corona shimmer
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.beginPath();
    ctx.arc(CX, CY, r * 1.3, 0, Math.PI * 2);
    const corona = ctx.createRadialGradient(CX, CY, r, CX, CY, r * 1.3);
    corona.addColorStop(0, 'rgba(255,200,80,0.15)');
    corona.addColorStop(1, 'rgba(255,120,0,0)');
    ctx.fillStyle = corona;
    ctx.fill();
    ctx.restore();
  }

  function drawOrbitPath(cx, cy, radius) {
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawPlanet(p, t) {
    const dist = p.orbit * BASE_ORBIT_RADIUS;
    const x = CX + Math.cos(angle * p.speed) * dist;
    const y = CY + Math.sin(angle * p.speed) * dist;
    const r = p.radius * Math.max(0.6, zoom * 0.85);

    // Glow
    const glow = ctx.createRadialGradient(x, y, r * 0.3, x, y, r * 2.5);
    glow.addColorStop(0, p.glowColor);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(x, y, r * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    // Saturn rings
    if (p.ring) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(0.4);
      ctx.scale(1, 0.35);
      ctx.beginPath();
      ctx.arc(0, 0, r * 2.0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(210,190,140,0.55)';
      ctx.lineWidth = r * 0.35;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.55, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(200,180,130,0.35)';
      ctx.lineWidth = r * 0.2;
      ctx.stroke();
      ctx.restore();
    }

    // Planet body
    const grad = ctx.createRadialGradient(x - r * 0.25, y - r * 0.25, r * 0.1, x, y, r);
    grad.addColorStop(0, lighten(p.color, 40));
    grad.addColorStop(0.7, p.color);
    grad.addColorStop(1, darken(p.color, 50));
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Label
    ctx.font = `${Math.max(9, 11 * zoom)}px 'Segoe UI', system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(p.name, x, y - r - 7 * zoom);
  }

  function lighten(hex, amount) {
    const rgb = hexToRgb(hex);
    return `rgb(${Math.min(255, rgb.r + amount)},${Math.min(255, rgb.g + amount)},${Math.min(255, rgb.b + amount)})`;
  }

  function darken(hex, amount) {
    const rgb = hexToRgb(hex);
    return `rgb(${Math.max(0, rgb.r - amount)},${Math.max(0, rgb.g - amount)},${Math.max(0, rgb.b - amount)})`;
  }

  function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : { r: 128, g: 128, b: 128 };
  }

  // ── Main loop ─────────────────────────────────────────────────
  let lastTime = 0;

  function frame(timestamp) {
    const dt = lastTime ? (timestamp - lastTime) : 16;
    lastTime = timestamp;

    if (!paused) {
      angle += dt * 0.0004 * speedMul;
    }

    // Clear
    ctx.clearRect(0, 0, SIZE, SIZE);

    // Background gradient
    const bgGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, SIZE * 0.7);
    bgGrad.addColorStop(0, '#0a0a1a');
    bgGrad.addColorStop(1, '#020208');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, SIZE, SIZE);

    // Stars
    drawStars(timestamp);

    // Orbit paths
    for (const p of PLANETS) {
      drawOrbitPath(CX, CY, p.orbit * BASE_ORBIT_RADIUS);
    }

    // Sun
    drawSun();

    // Planets (sorted by distance for layering)
    for (const p of PLANETS) {
      drawPlanet(p, timestamp);
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
