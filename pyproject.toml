# pyproject.toml — the single source of truth for what Seymour's backend needs.
#
# `uv pip install -e .` reads this file, installs the dependencies, and puts
# the `seymour` package on the import path in "editable" mode (changes to the
# source take effect without reinstalling).

[project]
# The distribution name and version, shown by `pip list`.
name = "seymour"
version = "0.1.0"
description = "A local-first AI workspace: a background agent and a human sharing one model without taking turns."
# Floor of 3.11 (matches the guide's finding for the reference stack);
# the repo venv is 3.12.
requires-python = ">=3.11"

# Runtime dependencies. Each one earns its place:
dependencies = [
    "fastapi>=0.115",        # the web framework: routes, validation, responses
    "uvicorn[standard]>=0.30", # the ASGI server that actually runs FastAPI
    "httpx>=0.27",           # async HTTP client — how we talk to llama-server
    "sqlalchemy>=2.0",       # the ORM: our schema as readable Python classes
    "pydantic-settings>=2.0", # typed configuration from env vars / .env file
    "huggingface_hub>=0.24", # model search + download from Hugging Face
    "psutil>=5.9",           # battery state, so the agent can throttle politely
    "python-multipart>=0.0.9", # multipart parsing for chat file uploads
    "pypdf>=4.0",            # PDF text extraction for attached documents
    # Office formats the agent's sandboxed `run_command` python must be able
    # to read and write — spreadsheets and slide decks are first-class
    # deliverables in the eval set (see evals/EVALS.md, "office").
    "openpyxl>=3.1",         # .xlsx read/write (cells, formulas, sheets)
    "python-pptx>=1.0",      # .pptx read/write (slides, text, images)
    # Added 2026-09-11 for the verifiers, the renderer and the new skills:
    "python-docx>=1.1",      # .docx read/write (the docx skill; docx verifier)
    "pymupdf>=1.24",         # rasterize soffice's PDFs to PNG (pdftoppm is not installed)
    "pandas>=2.2",           # data wrangling (xlsx + data-analysis skills; eval checkers)
    "matplotlib>=3.9",       # charts to PNG (data-analysis skill)
    "playwright>=1.47",      # headless Chromium: page interactions, screenshots, check_page fallback
]

# Development-only dependencies, installed with `uv pip install -e ".[dev]"`.
[project.optional-dependencies]
# The MLX backend (Apple Silicon only): `uv pip install -e ".[mlx]"`.
# Two packages because the two things a person wants live in different
# programs today — mlx-lm serves with continuous batching and a prefix
# prompt cache; mlx-vlm serves Qwen3.5/3.8 with the MTP drafter. Both
# are launched as child processes by seymour/engine/mlx.py; the GGUF
# path (llama.cpp) needs neither.
mlx = [
    "mlx-lm>=0.31",          # mlx_lm server: batching + LRU prompt cache
    "mlx-vlm>=0.6.17",       # mlx_vlm server: MTP speculative decoding
]
dev = [
    "pytest>=8.0",           # the test runner
    "pytest-asyncio>=0.23",  # lets tests `await` — the scheduler is async
]

# Tell the build backend which directory is the actual Python package.
[tool.setuptools]
packages = { find = { include = ["seymour*"] } }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# pytest configuration lives here too, so the repo has one config file fewer.
[tool.pytest.ini_options]
# `auto` mode lets us write `async def test_...` without decorating each one.
asyncio_mode = "auto"
testpaths = ["tests"]
